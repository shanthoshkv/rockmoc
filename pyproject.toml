[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rockmoc"
dynamic = ["version"]
description = "Industry-oriented Method of Characteristics (MOC) rocket nozzle design in Python — MLN, ideal, TIC, Rao, aerospike, plots, and literature-backed validation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "shanthoshkv", email = "shanthoshkv@gmail.com" },
]
maintainers = [
  { name = "shanthoshkv", email = "shanthoshkv@gmail.com" },
]
keywords = [
  "rocket",
  "nozzle",
  "method-of-characteristics",
  "MOC",
  "propulsion",
  "aerospace",
  "aerospike",
  "MLN",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
cli = []  # kept for compatibility: the CLI now uses argparse (no dependency)
fast = ["numba>=0.59"]
viz = ["plotly>=5.18"]
cea = ["RocketCEA>=1.2"]
cantera = ["cantera>=3.0"]
coolprop = ["CoolProp>=6.4"]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "hypothesis>=6.100",
  "ruff>=0.4",
  "build>=1.2",
  "twine>=5.0",
]
all = ["rockmoc[plot,fast,viz,dev,cea,cantera,coolprop]"]

[project.scripts]
rockmoc = "rockmoc.cli:main"

[project.urls]
Homepage = "https://aboutkvs.vercel.app/rockmoc.html"
Documentation = "https://github.com/shanthoshkv/rockmoc/blob/main/docs/how_to_use.md"
Repository = "https://github.com/shanthoshkv/rockmoc"
Issues = "https://github.com/shanthoshkv/rockmoc/issues"
Changelog = "https://github.com/shanthoshkv/rockmoc/blob/main/CHANGELOG.md"
"Project Website" = "https://aboutkvs.vercel.app/rockmoc.html"
"How to Use" = "https://github.com/shanthoshkv/rockmoc/blob/main/docs/how_to_use.md"

# Single source of truth for the version: src/rockmoc/_version.py
[tool.hatch.version]
path = "src/rockmoc/_version.py"

[tool.hatch.build.targets.sdist]
include = [
  "src/rockmoc",
  "tests",
  "examples",
  "docs",
  "README.md",
  "LICENSE",
  "pyproject.toml",
  "PUBLISH.md",
  "CHANGELOG.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rockmoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: long-running validation / convergence tests (run with -m slow)"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
