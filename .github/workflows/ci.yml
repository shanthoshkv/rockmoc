name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 3 * * *"  # nightly: full suite including slow tests
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "ruff>=0.4"
      - name: Ruff (pyflakes + import order)
        run: ruff check --select F,I src tests

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: |
          python -m pip install -U pip
          pip install -e ".[plot,dev]"
      - name: Pytest (fast; slow tests run nightly)
        if: github.event_name != 'schedule'
        run: pytest -q
      - name: Pytest (full, incl. slow)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pytest -q -m ""
      - name: Import / CLI smoke
        run: |
          python -c "import rockmoc; print(rockmoc.__version__)"
          rockmoc --version
          rockmoc design --type mln --Me 2.5 -n 16 --export csv,dxf -o smoke

  fast-kernels:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[fast,dev]"
      - name: Pytest with Numba-compiled kernels
        run: pytest -q
